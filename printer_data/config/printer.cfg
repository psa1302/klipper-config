# This file contains common pin mappings for the BIGTREETECH Manta M8P V2.0
# To use this config, the firmware should be compiled for the
# STM32H723 with a "128KiB bootloader" "25 MHz crystal"
# and "USB (on PA11/PA12)", "CAN bus (on PD0/PD1)" or Serial (on USART1 PA10/PA9).

# See docs/Config_Reference.md for a description of parameters.

[include mainsail.cfg]
[include macros.cfg]

[exclude_object]
[gcode_arcs]

# Motor1
[stepper_x]
step_pin: PE6
dir_pin: !PE5
enable_pin: !PC14
microsteps: 16
rotation_distance: 40
#endstop_pin: ^PF4
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: -10
position_min: -14
position_max: 220
homing_speed: 20
homing_retract_dist: 0
#homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC13
diag_pin: PF4 
interpolate: false
run_current: 0.800
stealthchop_threshold: 999999
driver_SGTHRS: 58


# Motor2
[stepper_y]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 16
rotation_distance: 40
#endstop_pin: ^PF3
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -2
position_min: -3
position_max: 230
homing_speed: 20
#homing_positive_dir: true
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PE3
diag_pin: PF3
interpolate: false
run_current: 0.800
stealthchop_threshold: 999999
driver_SGTHRS: 58

# Motor3
[stepper_z]
step_pin: PB8
dir_pin: PB7
enable_pin: !PE0
microsteps: 16
rotation_distance: 8
#endstop_pin: ^PF2
endstop_pin: probe:z_virtual_endstop
#position_endstop: 0
position_min: -4
position_max: 200
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PB9
##diag_pin: PF2
run_current: 0.650
stealthchop_threshold: 999999

## Motor4
# The M8P only has 4 heater outputs which leaves an extra stepper
# This can be used for a second Z stepper, dual_carriage, extruder co-stepper,
# or other accesory such as an MMU
[stepper_z1]
step_pin: PB4
dir_pin: PB3
enable_pin: !PB6
#endstop_pin: ^PF1
endstop_pin: probe:z_virtual_endstop
microsteps: 16
rotation_distance: 8

## Motor4
[tmc2209 stepper_z1]
uart_pin: PB5
##diag_pin: PF1
run_current: 0.650
stealthchop_threshold: 999999

# Motor5
[extruder]
max_extrude_cross_section: 5.0 #change if you change nozzle diameter to something large
step_pin: PG13
dir_pin: !PG12
enable_pin: !PG15
microsteps: 16
rotation_distance: 7.084
max_extrude_only_distance: 200
max_extrude_only_velocity: 80
max_extrude_only_accel: 5000
nozzle_diameter: 0.4
filament_diameter: 1.75
pressure_advance: 0.005
heater_pin: PA0 # HE0
sensor_pin: PB0 # T0
sensor_type: ATC Semitec 104GT-2
control: pid
pid_ki: 0.88
pid_kd: 59.12
pid_kp: 14.42
min_extrude_temp: 190
min_temp: 0
max_temp: 250


[tmc2209 extruder]
uart_pin: PG14
run_current: 0.800
stealthchop_threshold: 999999


[heater_bed]
heater_pin: PF5
sensor_pin: PB1 # TB 
sensor_type: EPCOS 100K B57560G104F
min_temp: 0
max_temp: 120
control: pid
pid_kp: 97.1 #tune this with this guide (https://www.obico.io/blog/klipper-pid-tuning/)
pid_ki: 1.41
pid_kd: 1675.16


[bed_mesh]
speed: 200
horizontal_move_z: 3
mesh_min: 14, 11
mesh_max: 210, 215
probe_count: 7,7 #change this if you want more or less probe points
mesh_pps: 4,4 
algorithm: bicubic
bicubic_tension: 0.2


# Fan0
[fan]
pin: PF7

# Fan1
[heater_fan fan1]
pin: PF9

# Fan2
[controller_fan fan2]
pin: !PF6

# Fan3
[controller_fan fan3]
pin: !PF8

# Fan4
#[controller_fan fan4]
#pin: !PA4

[temperature_fan controller_fan]
# Electronics fan PWM
pin: !PA4
max_power: 0.60
sensor_type: temperature_host
min_temp: 10
max_temp: 80
target_temp: 50

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 100


[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_190017001751313434373135-if00

#printer config
[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 10000 #yes it does 10k atlease at 250mm/s
max_z_velocity: 5 #dont change this
max_z_accel: 800


[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE7, EXP1_2=PG1,
    EXP1_3=PG0, EXP1_4=PF15,
    EXP1_5=PF14, EXP1_6=PF13,    # Slot in the socket on this side
    EXP1_7=PF12, EXP1_8=PF11,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PE13, EXP2_2=PE12,
    EXP2_3=PE15, EXP2_4=PE11,
    EXP2_5=PE10, EXP2_6=PE14,      # Slot in the socket on this side
    EXP2_7=PE8, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<NC>

# See the sample-lcd.cfg file for definitions of common LCD displays.

#[adxl345]
#cs_pin: PA15
#spi_bus: spi3a

#[bltouch]
#sensor_pin: PD13
#control_pin: PD12

## Proximity switch
[probe]
pin: PD8
x_offset : 24.0
y_offset : 13.35
#z_offset: 0
samples: 3
samples_result: average
samples_tolerance_retries: 1
sample_retract_dist: 2
speed: 15
lift_speed: 8
samples_tolerance : 0.1
samples_tolerance_retries : 3

