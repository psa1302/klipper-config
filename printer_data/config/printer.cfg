# This file contains common pin mappings for the BIGTREETECH Manta M8P V2.0
# To use this config, the firmware should be compiled for the
# STM32H723 with a "128KiB bootloader" "25 MHz crystal"
# and "USB (on PA11/PA12)", "CAN bus (on PD0/PD1)" or Serial (on USART1 PA10/PA9).

# See docs/Config_Reference.md for a description of parameters.

[include mainsail.cfg]
[include macros.cfg]
#[include adxl345.cfg]

[exclude_object]
[gcode_arcs]

# Motor1
[stepper_x]
step_pin: PE6
dir_pin: !PE5
enable_pin: !PC14
microsteps: 16
rotation_distance: 40
#endstop_pin: ^PF4
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: -10
position_min: -10
position_max: 220
homing_speed: 40
homing_retract_dist: 0
#homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC13
diag_pin: PF4
interpolate: false
run_current: 0.800
#stealthchop_threshold: 45   # managed by autotune_tmc
#driver_SGTHRS: 58           # managed by autotune_tmc (sg4_thrs)


# Motor2
[stepper_y]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 16
rotation_distance: 40
#endstop_pin: ^PF3
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -2
position_min: -3
position_max: 220
homing_speed: 40
#homing_positive_dir: true
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PE3
diag_pin: PF3
interpolate: false
run_current: 0.800
#stealthchop_threshold: 45   # managed by autotune_tmc
#driver_SGTHRS: 64           # managed by autotune_tmc (sg4_thrs)

# Motor3
[stepper_z]
step_pin: PB8
dir_pin: PB7
enable_pin: !PE0
microsteps: 16
rotation_distance: 8
#endstop_pin: ^PF2
endstop_pin: probe:z_virtual_endstop
#position_endstop: 0
position_min: -4
position_max: 200
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PB9
##diag_pin: PF2
run_current: 0.650
#stealthchop_threshold: 999999   # managed by autotune_tmc

## Motor4
# The M8P only has 4 heater outputs which leaves an extra stepper
# This can be used for a second Z stepper, dual_carriage, extruder co-stepper,
# or other accesory such as an MMU
[stepper_z1]
step_pin: PB4
dir_pin: PB3
enable_pin: !PB6
#endstop_pin: ^PF1
endstop_pin: probe:z_virtual_endstop
microsteps: 16
rotation_distance: 8

## Motor4
[tmc2209 stepper_z1]
uart_pin: PB5
##diag_pin: PF1
run_current: 0.650
#stealthchop_threshold: 999999   # managed by autotune_tmc

# Motor5
[extruder]
max_extrude_cross_section: 2.0 # headroom for start-purge lines; klipper default (0.64) is too strict
step_pin: PG13
dir_pin: !PG12
enable_pin: !PG15
microsteps: 16
rotation_distance: 7.084
max_extrude_only_distance: 200
max_extrude_only_velocity: 80
max_extrude_only_accel: 5000
nozzle_diameter: 0.4
filament_diameter: 1.75
pressure_advance: 0.03
pressure_advance_smooth_time: 0.02
heater_pin: PA0 # HE0
sensor_pin: PB0 # T0
sensor_type: ATC Semitec 104GT-2
control: pid
pid_ki: 0.88
pid_kd: 59.12
pid_kp: 14.42
min_extrude_temp: 190
min_temp: 0
max_temp: 250


[tmc2209 extruder]
uart_pin: PG14
run_current: 0.800
#stealthchop_threshold: 999999   # managed by autotune_tmc


[heater_bed]
heater_pin: PF5
sensor_pin: PB1 # TB 
sensor_type: EPCOS 100K B57560G104F
min_temp: 0
max_temp: 120
control: pid
pid_kp: 97.1 #tune this with this guide (https://www.obico.io/blog/klipper-pid-tuning/)
pid_ki: 1.41
pid_kd: 1675.16


[bed_mesh]
speed: 200
horizontal_move_z: 5
mesh_min: 14, 11
mesh_max: 210, 215
probe_count: 7,7 #change this if you want more or less probe points
mesh_pps: 4,4 
algorithm: bicubic
bicubic_tension: 0.2


# Fan0
[fan]
pin: PF7

# Fan1
[heater_fan fan1]
pin: PF9

# Fan2
#[temperature_fan mcu_cooler_fan]
#pin: PF6

[multi_pin mcu_fans]
pins: PF6, PF8, PA4

# Fan3
[temperature_fan mcu_cooler_fans]
pin: multi_pin:mcu_fans
max_power: 0.6
shutdown_speed: 0
#cycle_time:
#hardware_pwm:
#kick_start_time:
#off_below:
#tachometer_pin:
#tachometer_ppr:
#tachometer_poll_interval:
#enable_pin:
#   See the "fan" section for a description of the above parameters.
sensor_type: temperature_mcu
#sensor_pin:
control: watermark
max_delta: 2
min_temp: 10
max_temp: 80
#   See the "extruder" section for a description of the above parameters.
#pid_Kp:
#pid_Ki:
#pid_Kd:
#   The proportional (pid_Kp), integral (pid_Ki), and derivative
#   (pid_Kd) settings for the PID feedback control system. Klipper
#   evaluates the PID settings with the following general formula:
#     fan_pwm = max_power - (Kp*e + Ki*integral(e) - Kd*derivative(e)) / 255
#   Where "e" is "target_temperature - measured_temperature" and
#   "fan_pwm" is the requested fan rate with 0.0 being full off and
#   1.0 being full on. The pid_Kp, pid_Ki, and pid_Kd parameters must
#   be provided when the PID control algorithm is enabled.
#pid_deriv_time: 2.0
#   A time value (in seconds) over which temperature measurements will
#   be smoothed when using the PID control algorithm. This may reduce
#   the impact of measurement noise. The default is 2 seconds.
target_temp: 40.0
#   A temperature (in Celsius) that will be the target temperature.
#   The default is 40 degrees.
max_speed: 1.0
#   The fan speed (expressed as a value from 0.0 to 1.0) that the fan
#   will be set to when the sensor temperature exceeds the set value.
#   The default is 1.0.
min_speed: 0.3
#   The minimum fan speed (expressed as a value from 0.0 to 1.0) that
#   the fan will be set to for PID temperature fans.
#   The default is 0.3.
#gcode_id:
#   If set, the temperature will be reported in M105 queries using the
#   given id. The default is to not report the temperature via M105.


# Fan4
#[temperature_fan pi_cooler_fan]
