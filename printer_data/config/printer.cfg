#max_delta: 2
#min_temp: 10
#max_temp: 80
#   See the "extruder" section for a description of the above parameters.
#pid_Kp:
#pid_Ki:
#pid_Kd:
#   The proportional (pid_Kp), integral (pid_Ki), and derivative
#   (pid_Kd) settings for the PID feedback control system. Klipper
#   evaluates the PID settings with the following general formula:
#     fan_pwm = max_power - (Kp*e + Ki*integral(e) - Kd*derivative(e)) / 255
#   Where "e" is "target_temperature - measured_temperature" and
#   "fan_pwm" is the requested fan rate with 0.0 being full off and
#   1.0 being full on. The pid_Kp, pid_Ki, and pid_Kd parameters must
#   be provided when the PID control algorithm is enabled.
#pid_deriv_time: 2.0
#   A time value (in seconds) over which temperature measurements will
#   be smoothed when using the PID control algorithm. This may reduce
#   the impact of measurement noise. The default is 2 seconds.
#target_temp: 40.0
#   A temperature (in Celsius) that will be the target temperature.
#   The default is 40 degrees.
#max_speed: 1.0
#   The fan speed (expressed as a value from 0.0 to 1.0) that the fan
#   will be set to when the sensor temperature exceeds the set value.
#   The default is 1.0.
#min_speed: 0.3
#   The minimum fan speed (expressed as a value from 0.0 to 1.0) that
#   the fan will be set to for PID temperature fans.
#   The default is 0.3.
#gcode_id:
#   If set, the temperature will be reported in M105 queries using the
#   given id. The default is to not report the temperature via M105.


[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 100


[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_190017001751313434373135-if00

#printer config
[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 10000 # machine ceiling; quality-critical accels are set per-feature in the slicer
square_corner_velocity: 8
max_z_velocity: 5 #dont change this
max_z_accel: 800


[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE7, EXP1_2=PG1,
    EXP1_3=PG0, EXP1_4=PF15,
    EXP1_5=PF14, EXP1_6=PF13,    # Slot in the socket on this side
    EXP1_7=PF12, EXP1_8=PF11,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PE13, EXP2_2=PE12,
    EXP2_3=PE15, EXP2_4=PE11,
    EXP2_5=PE10, EXP2_6=PE14,      # Slot in the socket on this side
    EXP2_7=PE8, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<NC>

# See the sample-lcd.cfg file for definitions of common LCD displays.

#[adxl345]
#cs_pin: PA15
#spi_bus: spi3a

#[bltouch]
#sensor_pin: PD13
#control_pin: PD12

## Proximity switch
[probe]
pin: PD8
x_offset : 24.0
y_offset : 13.35
#z_offset: 0
samples: 3
samples_result: average
sample_retract_dist: 2
speed: 15
lift_speed: 8
samples_tolerance : 0.1
samples_tolerance_retries : 3

[z_tilt]
z_positions:
    -35, 110
    255, 110
points:
    5, 96.65
    180, 96.65
speed: 100
horizontal_move_z: 5
retries: 5
retry_tolerance: 0.02

[screws_tilt_adjust]
screw1: 27,38
screw1_name: front left screw
screw2: 187, 38
screw2_name: front right screw
screw3: 187, 184 
screw3_name: rear right screw 
screw4: 27, 184
screw4_name: rear left screw
horizontal_move_z: 10
speed: 50
screw_thread: CCW-M4 #measure the diameter of your adjustment screw

## TMC autotune — motor-specific driver tuning
## Stock Anycubic motors have no published specs; resistance was measured via
## the drivers' PWM_AUTO registers, calibrated against the known creality-42-34.
[motor_constants anycubic-42shdc0059-18d]
resistance: 2.1
inductance: 0.0037
holding_torque: 0.40
max_current: 1.5
steps_per_revolution: 200

[motor_constants anycubic-42bygh0714]
resistance: 1.2
inductance: 0.0022
holding_torque: 0.15
max_current: 1.0
steps_per_revolution: 200

[autotune_tmc stepper_x]
motor: anycubic-42shdc0059-18d
tuning_goal: silent
sg4_thrs: 70
voltage: 24

[autotune_tmc stepper_y]
motor: anycubic-42shdc0059-18d
tuning_goal: silent
sg4_thrs: 88
voltage: 24

[autotune_tmc stepper_z]
motor: creality-42-34
tuning_goal: silent
voltage: 24

[autotune_tmc stepper_z1]
motor: anycubic-42shdc0059-18d
tuning_goal: silent
voltage: 24

[autotune_tmc extruder]
motor: anycubic-42bygh0714
tuning_goal: silent
voltage: 24

