# This file contains common pin mappings for the BIGTREETECH Manta M8P V2.0
# To use this config, the firmware should be compiled for the
# STM32H723 with a "128KiB bootloader" "25 MHz crystal"
# and "USB (on PA11/PA12)", "CAN bus (on PD0/PD1)" or Serial (on USART1 PA10/PA9).

# See docs/Config_Reference.md for a description of parameters.

[include mainsail.cfg]
[include macros.cfg]

[exclude_object]
[gcode_arcs]

# Motor1
[stepper_x]
step_pin: PE6
dir_pin: !PE5
enable_pin: !PC14
microsteps: 16
rotation_distance: 40
#endstop_pin: ^PF4
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: -10
position_min: -14
position_max: 220
homing_speed: 20
homing_retract_dist: 0
#homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC13
diag_pin: PF4 
interpolate: true
run_current: 0.800
stealthchop_threshold: 999999
driver_SGTHRS: 58


# Motor2
[stepper_y]
step_pin: PE2
dir_pin: !PE1
enable_pin: !PE4
microsteps: 16
rotation_distance: 40
#endstop_pin: ^PF3
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -2
position_min: -3
position_max: 230
homing_speed: 20
#homing_positive_dir: true
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PE3
diag_pin: PF3
interpolate: true
run_current: 0.800
stealthchop_threshold: 999999
driver_SGTHRS: 58

# Motor3
[stepper_z]
step_pin: PB8
dir_pin: PB7
enable_pin: !PE0
microsteps: 16
rotation_distance: 8
#endstop_pin: ^PF2
endstop_pin: probe:z_virtual_endstop
#position_endstop: 0
position_min: -4
position_max: 200
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PB9
##diag_pin: PF2
run_current: 0.650
stealthchop_threshold: 999999

## Motor4
# The M8P only has 4 heater outputs which leaves an extra stepper
# This can be used for a second Z stepper, dual_carriage, extruder co-stepper,
# or other accesory such as an MMU
[stepper_z1]
step_pin: PB4
dir_pin: PB3
enable_pin: !PB6
#endstop_pin: ^PF1
endstop_pin: probe:z_virtual_endstop
microsteps: 16
rotation_distance: 8

## Motor4
[tmc2209 stepper_z1]
uart_pin: PB5
##diag_pin: PF1
run_current: 0.650
stealthchop_threshold: 999999

# Motor5
[extruder]
max_extrude_cross_section: 5.0 #change if you change nozzle diameter to something large
step_pin: PG13
dir_pin: !PG12
enable_pin: !PG15
microsteps: 16
rotation_distance: 7.084
max_extrude_only_distance: 200
max_extrude_only_velocity: 80
max_extrude_only_accel: 5000
nozzle_diameter: 0.4
filament_diameter: 1.75
pressure_advance: 0.06
heater_pin: PA0 # HE0
sensor_pin: PB0 # T0
sensor_type: ATC Semitec 104GT-2
control: pid
pid_ki: 0.88
pid_kd: 59.12
pid_kp: 14.42
min_temp: 0
max_temp: 250


[tmc2209 extruder]
uart_pin: PG14
run_current: 0.800
stealthchop_threshold: 999999

## End-Stop 5
#[filament_switch_sensor material_0]
#switch_pin: PF0

