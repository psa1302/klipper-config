## Proximity switch
[probe]
pin: PD8
x_offset : 24.0
y_offset : 13.35
z_offset: 0
samples: 3
samples_result: average
samples_tolerance_retries: 1
sample_retract_dist: 2
speed: 15
lift_speed: 8
samples_tolerance : 0.1
samples_tolerance_retries : 3


